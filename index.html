<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Dashboard de Liderazgo · Wendy Wünder</title>
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --orange:#FF7F00;--coral:#E53831;--magenta:#CF0156;--pink:#E2296B;--yellow:#F7D514;
  --ink:#1E1C1E;--muted:#6D6463;--cream:#FEF6F3;--peach:#FDEEE8;--line:#F1DCD4;--white:#fff;
  --ok:#1F9D6B;--mid:#F2A100;--bad:#E53831;
  --grad-h:linear-gradient(90deg,#FF7F00 0%,#F35F15 35%,#E53831 65%,#CF0156 100%);
  --display:"Montserrat","Arial Black",system-ui,sans-serif;
  --text:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --shadow:0 8px 24px rgba(150,10,60,.10);
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;border-radius:6px}
.btn{border:0;border-radius:999px;padding:11px 20px;font-family:var(--display);font-weight:800;font-size:14px;background:var(--grad-h);color:#fff;box-shadow:0 6px 18px rgba(207,1,86,.25)}
.btn.line{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.line:hover{border-color:var(--pink);color:var(--pink)}

/* Login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--grad-h)}
.login form{background:#fff;border-radius:20px;padding:34px 30px;width:min(400px,100%);box-shadow:0 20px 50px rgba(100,0,40,.35)}
.login img{height:34px;margin-bottom:22px}
.login h1{font-family:var(--display);font-weight:900;font-size:24px;margin:0 0 6px}
.login p{color:var(--muted);margin:0 0 18px}
.login input{width:100%;border:2px solid var(--line);border-radius:12px;padding:13px 15px;font:inherit;margin-bottom:12px}
.login input:focus{border-color:var(--pink);outline:0}
.login .err{color:var(--coral);font-weight:600;min-height:20px;margin-bottom:8px;font-size:14px}
.login .btn{width:100%;padding:14px}

/* App */
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.top .in{max-width:1240px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.top img{height:30px}
.top h1{font-family:var(--display);font-weight:900;font-size:18px;margin:0;flex:1;min-width:180px}
.top .upd{color:var(--muted);font-size:13px}
.wrap{max-width:1240px;margin:0 auto;padding:20px}
.filters{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;box-shadow:var(--shadow);align-items:end}
.filters label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.filters select,.filters input{width:100%;margin-top:5px;border:2px solid var(--line);border-radius:10px;padding:9px 10px;font:inherit;background:#fff;color:var(--ink)}
.filters select:focus,.filters input:focus{border-color:var(--pink);outline:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:18px 0}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}
.kpi small{display:block;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.kpi b{display:block;font-family:var(--display);font-weight:900;font-size:32px;line-height:1.15;margin-top:4px}
.kpi span{color:var(--muted);font-size:13px}
.kpi.hl b{background:var(--grad-h);-webkit-background-clip:text;background-clip:text;color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.card h2{font-family:var(--display);font-weight:800;font-size:15px;margin:0 0 12px}
.card .cv{position:relative;height:260px}
.empty{color:var(--muted);text-align:center;padding:40px 10px}
.tablecard{margin-top:14px}
.thead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.tscroll{overflow:auto;max-height:520px;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:860px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--peach);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);cursor:pointer;user-select:none}
th:hover{color:var(--pink)}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--cream)}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.p-1{background:#FDE3E1;color:#B3261E}.p-2{background:#FFF1CC;color:#8A5A00}.p-3{background:#D9F3E8;color:#146C48}
.pv{font-weight:700}
.mini{display:inline-block;height:8px;border-radius:4px;background:var(--line);width:60px;vertical-align:middle;margin-right:6px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--grad-h)}

/* Detalle */
.modal{position:fixed;inset:0;background:rgba(30,28,30,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal .box{background:#fff;border-radius:20px;padding:24px;width:min(640px,100%);max-height:92vh;overflow:auto}
.modal h3{font-family:var(--display);font-weight:900;font-size:22px;margin:0}
.modal .meta{color:var(--muted);margin:2px 0 14px}
.bar{display:grid;grid-template-columns:120px 1fr 90px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.bar .tr{height:12px;background:var(--line);border-radius:6px;overflow:hidden}.bar .tr i{display:block;height:100%;background:var(--grad-h)}
.ans{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:8px}
.ans span{background:var(--peach);border-radius:8px;text-align:center;padding:6px 0;font-weight:700;font-size:13px}
.ans small{display:block;font-size:10px;color:var(--muted);font-weight:500}
.err-banner{background:#FDE3E1;color:#B3261E;border-radius:12px;padding:12px 16px;margin:14px 0;font-weight:600}
@media(max-width:560px){.kpi b{font-size:26px}.bar{grid-template-columns:90px 1fr 70px}.ans{grid-template-columns:repeat(5,1fr)}}
</style>
</head>
<body>

<div class="login" id="login" hidden>
  <form id="login-form">
    <img src="assets/logo-wendy-wunder.png" alt="Wendy Wünder">
    <h1>Dashboard de liderazgo</h1>
    <p>Ingresa la clave de acceso para ver los resultados.</p>
    <input type="password" id="pw" placeholder="Clave de acceso" autocomplete="current-password" required>
    <div class="err" id="login-err" role="alert"></div>
    <button class="btn" type="submit">Entrar</button>
  </form>
</div>

<div id="app" hidden>
  <header class="top"><div class="in">
    <img src="assets/logo-wendy-wunder.png" alt="Wendy Wünder">
    <h1>Dashboard · Test de liderazgo</h1>
    <span class="upd" id="upd"></span>
    <button class="btn line" id="btn-refresh" type="button">Actualizar</button>
    <button class="btn line" id="btn-logout" type="button">Salir</button>
  </div></header>

  <main class="wrap">
    <div id="banner"></div>
    <section class="filters" aria-label="Filtros">
      <div><label for="f-q">Buscar</label><input id="f-q" type="search" placeholder="Nombre o correo"></div>
      <div><label for="f-emp">Empresa</label><select id="f-emp"></select></div>
      <div><label for="f-grp">Grupo / taller</label><select id="f-grp"></select></div>
      <div><label for="f-per">Perfil</label><select id="f-per"></select></div>
      <div><label for="f-from">Desde</label><input id="f-from" type="date"></div>
      <div><label for="f-to">Hasta</label><input id="f-to" type="date"></div>
      <div><button class="btn line" id="f-clear" type="button" style="width:100%">Limpiar filtros</button></div>
    </section>

    <section class="kpis" id="kpis"></section>

    <section class="grid">
      <div class="card"><h2>Promedio por bloque (%)</h2><div class="cv"><canvas id="c-blocks"></canvas></div></div>
      <div class="card"><h2>Distribución de perfiles</h2><div class="cv"><canvas id="c-prof"></canvas></div></div>
      <div class="card"><h2>Participantes por semana</h2><div class="cv"><canvas id="c-time"></canvas></div></div>
      <div class="card"><h2>Promedio por grupo / empresa</h2><div class="cv"><canvas id="c-group"></canvas></div></div>
    </section>

    <section class="card tablecard">
      <div class="thead"><h2 style="margin:0">Resultados individuales <span id="count" style="color:var(--muted);font-weight:500"></span></h2>
        <button class="btn" id="btn-csv" type="button">Descargar CSV (filtrado)</button></div>
      <div class="tscroll"><table>
        <thead><tr id="thr"></tr></thead><tbody id="tbody"></tbody>
      </table></div>
    </section>
  </main>
</div>

<div class="modal" id="modal" hidden><div class="box" id="modal-box"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const BLOCKS=["Conócete","Claridad","Escucha","Haz crecer"];
const COLORS=["#FF7F00","#E53831","#CF0156","#F7D514"];
const PERFILES=["Modo jefe","Líder en construcción","Líder que hace crecer"];
const pct=s=>Math.round(s/25*100);
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate=d=>new Date(d).toLocaleString("es-PE",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
const profCls=p=>p==="Modo jefe"?"p-1":p==="Líder en construcción"?"p-2":"p-3";

let ALL=[],VIEW=[],sortKey="created_at",sortDir=-1,charts={},timer;
const COLS=[["created_at","Fecha"],["nombre","Nombre"],["email","Correo"],["empresa","Empresa"],["grupo","Grupo"],["total","Total"],["perfil","Perfil"],["b1","Conócete"],["b2","Claridad"],["b3","Escucha"],["b4","Haz crecer"],["bloque_bajo","Bloque más bajo"]];
$("thr").innerHTML=COLS.map(c=>`<th data-k="${c[0]}">${c[1]}</th>`).join("");

/* ---------- sesión ---------- */
async function api(path,opts){const r=await fetch(path,Object.assign({credentials:"same-origin"},opts));let j=null;try{j=await r.json();}catch(e){}return{ok:r.ok,status:r.status,json:j};}
async function boot(){
  const s=await api("/api/login");
  if(s.ok&&s.json&&s.json.ok){showApp();}else{$("login").hidden=false;$("app").hidden=true;}
}
$("login-form").addEventListener("submit",async e=>{
  e.preventDefault();$("login-err").textContent="";
  const r=await api("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("pw").value})});
  if(r.ok){$("pw").value="";showApp();}else{$("login-err").textContent=(r.json&&r.json.error)||"No se pudo entrar";}
});
$("btn-logout").addEventListener("click",async()=>{await api("/api/login",{method:"DELETE"});clearInterval(timer);location.reload();});
function showApp(){$("login").hidden=true;$("app").hidden=false;load();clearInterval(timer);timer=setInterval(load,60000);}

/* ---------- datos ---------- */
async function load(){
  const r=await api("/api/data");
  if(r.status===401){clearInterval(timer);$("app").hidden=true;$("login").hidden=false;return;}
  if(!r.ok||!Array.isArray(r.json)){$("banner").innerHTML=`<div class="err-banner">${esc((r.json&&r.json.error)||"No se pudieron cargar los datos")}</div>`;return;}
  $("banner").innerHTML="";
  ALL=r.json;
  $("upd").textContent="Actualizado "+new Date().toLocaleTimeString("es-PE",{hour:"2-digit",minute:"2-digit"});
  fillSelect("f-emp",ALL.map(x=>x.empresa),"Todas");
  fillSelect("f-grp",ALL.map(x=>x.grupo),"Todos");
  fillSelect("f-per",PERFILES,"Todos");
  render();
}
function fillSelect(id,vals,all){
  const el=$(id),cur=el.value;
  const u=[...new Set(vals.filter(Boolean))].sort((a,b)=>a.localeCompare(b,"es"));
  el.innerHTML=`<option value="">${all}</option>`+u.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("");
  el.value=u.includes(cur)?cur:"";
}
$("btn-refresh").addEventListener("click",load);

/* ---------- filtros ---------- */
["f-q","f-emp","f-grp","f-per","f-from","f-to"].forEach(id=>$(id).addEventListener("input",render));
$("f-clear").addEventListener("click",()=>{["f-q","f-emp","f-grp","f-per","f-from","f-to"].forEach(id=>$(id).value="");render();});
function filtered(){
  const q=$("f-q").value.trim().toLowerCase(),emp=$("f-emp").value,grp=$("f-grp").value,per=$("f-per").value;
  const from=$("f-from").value?new Date($("f-from").value+"T00:00:00"):null,to=$("f-to").value?new Date($("f-to").value+"T23:59:59"):null;
  return ALL.filter(x=>{
    if(q&&!((x.nombre||"")+" "+(x.email||"")).toLowerCase().includes(q))return false;
    if(emp&&x.empresa!==emp)return false;
    if(grp&&x.grupo!==grp)return false;
    if(per&&x.perfil!==per)return false;
    const d=new Date(x.created_at);
    if(from&&d<from)return false;
    if(to&&d>to)return false;
    return true;
  });
}

/* ---------- render ---------- */
function render(){
  VIEW=filtered();
  renderKpis();renderCharts();renderTable();
}
function renderKpis(){
  const n=VIEW.length;
  if(!n){$("kpis").innerHTML=`<div class="kpi" style="grid-column:1/-1"><div class="empty">Sin resultados para mostrar.</div></div>`;return;}
  const tot=avg(VIEW.map(x=>x.total));
  const bavg=[1,2,3,4].map(i=>avg(VIEW.map(x=>x["b"+i])));
  const hi=bavg.indexOf(Math.max(...bavg)),lo=bavg.indexOf(Math.min(...bavg));
  const pc={};VIEW.forEach(x=>pc[x.perfil]=(pc[x.perfil]||0)+1);
  const top=Object.entries(pc).sort((a,b)=>b[1]-a[1])[0];
  const empresas=new Set(VIEW.map(x=>x.empresa).filter(Boolean)).size;
  $("kpis").innerHTML=[
    ["Participantes",n,empresas?`${empresas} empresa${empresas>1?"s":""}`:"",1],
    ["Puntaje promedio",tot.toFixed(1)+" / 100","",1],
    ["Bloque más fuerte",BLOCKS[hi],pct(bavg[hi])+"% promedio"],
    ["Bloque a trabajar",BLOCKS[lo],pct(bavg[lo])+"% promedio"],
    ["Perfil más común",top[0],`${top[1]} de ${n} (${Math.round(top[1]/n*100)}%)`]
  ].map(k=>`<div class="kpi${k[3]?" hl":""}"><small>${k[0]}</small><b${String(k[1]).length>12?' style="font-size:22px"':""}>${esc(k[1])}</b><span>${esc(k[2])}</span></div>`).join("");
}
function mk(id,cfg){if(charts[id])charts[id].destroy();charts[id]=new Chart($(id),cfg);}
const baseOpts={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}};
function renderCharts(){
  const n=VIEW.length;
  Chart.defaults.font.family='Inter, system-ui, sans-serif';
  mk("c-blocks",{type:"bar",data:{labels:BLOCKS,datasets:[{data:[1,2,3,4].map(i=>n?Math.round(pct(avg(VIEW.map(x=>x["b"+i])))):0),backgroundColor:COLORS,borderRadius:8}]},
    options:Object.assign({},baseOpts,{scales:{y:{min:0,max:100,ticks:{callback:v=>v+"%"}}}})});
  const pc=PERFILES.map(p=>VIEW.filter(x=>x.perfil===p).length);
  mk("c-prof",{type:"doughnut",data:{labels:PERFILES,datasets:[{data:pc,backgroundColor:["#E53831","#F2A100","#1F9D6B"],borderWidth:0}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:"62%",plugins:{legend:{position:"bottom"}}}});
  // por semana
  const wk={};VIEW.forEach(x=>{const d=new Date(x.created_at);const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);d.setHours(0,0,0,0);const k=d.toISOString().slice(0,10);wk[k]=(wk[k]||0)+1;});
  const ks=Object.keys(wk).sort();
  mk("c-time",{type:"line",data:{labels:ks.map(k=>new Date(k+"T00:00:00").toLocaleDateString("es-PE",{day:"2-digit",month:"short"})),datasets:[{data:ks.map(k=>wk[k]),borderColor:"#CF0156",backgroundColor:"rgba(207,1,86,.12)",fill:true,tension:.3,pointRadius:4}]},
    options:Object.assign({},baseOpts,{scales:{y:{beginAtZero:true,ticks:{precision:0}}}})});
  // por grupo (o empresa si no hay grupos)
  const key=VIEW.some(x=>x.grupo)?"grupo":"empresa";
  const g={};VIEW.forEach(x=>{const k=x[key]||"(sin dato)";(g[k]=g[k]||[]).push(x.total);});
  const gs=Object.entries(g).map(([k,v])=>[k,avg(v),v.length]).sort((a,b)=>b[1]-a[1]).slice(0,12);
  mk("c-group",{type:"bar",data:{labels:gs.map(x=>`${x[0]} (${x[2]})`),datasets:[{data:gs.map(x=>+x[1].toFixed(1)),backgroundColor:"#E2296B",borderRadius:8}]},
    options:Object.assign({},baseOpts,{indexAxis:"y",scales:{x:{min:0,max:100}}})});
}
function renderTable(){
  const rows=VIEW.slice().sort((a,b)=>{const x=a[sortKey],y=b[sortKey];return (x==null?-1:y==null?1:(x>y?1:x<y?-1:0))*sortDir;});
  $("count").textContent=`(${rows.length})`;
  $("tbody").innerHTML=rows.map(x=>`<tr data-id="${esc(x.id)}">
    <td>${fmtDate(x.created_at)}</td><td>${esc(x.nombre)}</td><td>${esc(x.email)}</td><td>${esc(x.empresa)}</td><td>${esc(x.grupo)}</td>
    <td class="pv">${x.total}</td><td><span class="chip ${profCls(x.perfil)}">${esc(x.perfil)}</span></td>
    ${[1,2,3,4].map(i=>`<td><span class="mini"><i style="width:${pct(x["b"+i])}%"></i></span>${pct(x["b"+i])}%</td>`).join("")}
    <td>${esc(x.bloque_bajo)}</td></tr>`).join("")||`<tr><td colspan="12" class="empty">Aún no hay resultados.</td></tr>`;
}
$("thr").addEventListener("click",e=>{const th=e.target.closest("th");if(!th)return;const k=th.dataset.k;sortDir=(sortKey===k)?-sortDir:-1;sortKey=k;renderTable();});

/* ---------- detalle ---------- */
$("tbody").addEventListener("click",e=>{
  const tr=e.target.closest("tr");if(!tr||!tr.dataset.id)return;
  const x=ALL.find(r=>r.id===tr.dataset.id);if(!x)return;
  $("modal-box").innerHTML=`<h3>${esc(x.nombre)}</h3>
   <div class="meta">${esc(x.email)}${x.empresa?" · "+esc(x.empresa):""}${x.grupo?" · "+esc(x.grupo):""}<br>${fmtDate(x.created_at)}</div>
   <p><b style="font-size:26px;font-family:var(--display)">${x.total}/100</b> <span class="chip ${profCls(x.perfil)}">${esc(x.perfil)}</span></p>
   ${[1,2,3,4].map(i=>`<div class="bar"><span>${BLOCKS[i-1]}</span><div class="tr"><i style="width:${pct(x["b"+i])}%"></i></div><b>${pct(x["b"+i])}% <small style="font-weight:500;color:var(--muted)">${x["b"+i]}/25</small></b></div>`).join("")}
   <h4 style="margin:16px 0 0">Respuestas (1 = Nunca · 5 = Siempre)</h4>
   <div class="ans">${(x.respuestas||[]).map((v,i)=>`<span><small>P${i+1}</small>${v}</span>`).join("")}</div>
   <p style="text-align:right;margin:18px 0 0"><button class="btn line" id="modal-close" type="button">Cerrar</button></p>`;
  $("modal").hidden=false;$("modal-close").focus();
});
$("modal").addEventListener("click",e=>{if(e.target===$("modal")||e.target.id==="modal-close")$("modal").hidden=true;});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("modal").hidden=true;});

/* ---------- CSV ---------- */
$("btn-csv").addEventListener("click",()=>{
  const head=["Fecha","Nombre","Correo","Empresa","Grupo","Total","Perfil","Conócete (/25)","Claridad (/25)","Escucha (/25)","Haz crecer (/25)","Bloque más bajo",...Array.from({length:20},(_,i)=>"P"+(i+1))];
  const cell=v=>{let s=String(v==null?"":v);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};
  const lines=[head.map(cell).join(",")].concat(VIEW.map(x=>[fmtDate(x.created_at),x.nombre,x.email,x.empresa,x.grupo,x.total,x.perfil,x.b1,x.b2,x.b3,x.b4,x.bloque_bajo,...(x.respuestas||[])].map(cell).join(",")));
  const blob=new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="resultados-liderazgo.csv";document.body.appendChild(a);a.click();a.remove();
});

boot();
})();
</script>
</body>
</html>
